<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout can reach under the notch and home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Installable to the home screen. The manifest is the closest thing to the v2 "native
      app" goal without a rewrite, and it is not only cosmetic: iOS clears a site's
      localStorage after about seven days without a visit, which is what quietly loses
      someone's saved events. A web app installed to the home screen is not subject to
      that, so this is the cheapest fix to the durability problem behind the requests for
      accounts.

      apple-touch-icon is separate and not redundant: iOS does not read the manifest for
      the home-screen icon, only this link. Without it the icon becomes a screenshot of
      the page.

      No service worker, deliberately. The manifest is what makes the app installable;
      a service worker mainly adds offline support, and a badly scoped one serves a stale
      bundle after a deploy — a silent failure this project has paid for before.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vegas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Both spellings: `apple-` is what older iOS reads, and Chrome logs a deprecation
         warning unless the standard name is present too. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>Vegas This Weekend</title>
    <meta
      name="description"
      content="What's on in Las Vegas this weekend, listed by day. Save what looks good, share it with your group. No account needed."
    />
    <link rel="canonical" href="https://vegasthisweekend.com/" />

    <!--
      Share previews. This app spreads by people pasting links into group chats, so
      these tags are the growth loop, not decoration.

      og:image MUST be an absolute URL — Facebook, iMessage, WhatsApp and X all fetch it
      from their own servers, where a relative path resolves against nothing.

      The ?v= is a cache-buster. Those scrapers cache a preview per URL for days, so if
      you regenerate the card (npm run og), bump this number or the old image keeps
      being served.

      These are the defaults, and /e/<id> does not serve them: an edge function rewrites
      the title, description, url and image per event before a scraper sees them. See
      netlify/edge-functions/event-meta.js. It matches on the property attribute rather
      than the whole tag, so reformatting below is safe — but removing a tag outright
      makes it silently skip that one.
    -->
    <meta property="og:site_name" content="Vegas This Weekend" />
    <meta property="og:title" content="Vegas This Weekend" />
    <meta
      property="og:description"
      content="What's on in Las Vegas this weekend, listed by day. Save what looks good, send it to your group."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vegasthisweekend.com/" />
    <meta property="og:image" content="https://vegasthisweekend.com/og-image.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vegas This Weekend — what's on, listed by day. Save what looks good, send it to your group."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vegas This Weekend" />
    <meta
      name="twitter:description"
      content="What's on in Las Vegas this weekend, listed by day. Save what looks good, send it to your group."
    />
    <meta name="twitter:image" content="https://vegasthisweekend.com/og-image.jpg?v=1" />

    <!--
      No analytics script. Interaction counting is first-party — see src/analytics.js —
      and Cloudflare covers traffic without a script at all, so this page loads nothing
      from a third party.

      Plausible used to live here. It was removed rather than kept alongside because it
      structurally could not answer the question the app has: which *events* people save.
      Answering that means attaching a count to an event id, and sending event ids to a
      third party was the thing we had deliberately avoided. Counting them ourselves is
      both more useful and more private.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
