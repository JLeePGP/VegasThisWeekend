[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Client-side routing: /saved, /s/<token> and /e/<id> are React Router paths, not files.
# The event route matters most here — it is the one people paste to each other, so a
# missing fallback would 404 exactly the links that travel.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Per-event share previews. Declared here as well as in the function's own `config`
# export so the routing is visible in the place someone looks for routing.
#
# It runs before the fallback above, so `context.next()` inside it returns the built
# index.html and the function substitutes the <head> into it. Everything about the SPA is
# unchanged — this only affects the markup a scraper reads before any JavaScript runs.
[[edge_functions]]
  path = "/e/*"
  function = "event-meta"
